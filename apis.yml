name: iambuddy.com
description: >-
  Buddy (iambuddy.com, now buddy.insure) is a digital insurance commerce
  platform that turns insurance product rules, pricing, and workflows into
  structured data via its Insurance Object Notation (ION) engine, so carriers,
  MGAs, brokers, and agents can sell P&C insurance online across direct,
  agent-assisted, embedded, and agentic channels without core-system changes.
  Its Offer Element embeddable checkout widget adds quote, apply, bind, and pay
  in a few lines of code, and Buddy MCP connects insurance products to AI
  assistants such as Claude for conversational selling. Founded by Charles
  Merritt and David Vogeleer in Richmond, Virginia, Buddy is licensed in all 50
  states and is SOC 2 Type 2 and PCI DSS compliant, working with carriers
  including Allstate, Aon, W.R. Berkley, Chubb, Great American, and Starr.
